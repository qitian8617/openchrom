name: hwstation

on:
  pull_request:
    paths:
      - "tools/hwstation/**"
      - ".github/workflows/hwstation.yml"

permissions:
  contents: read

jobs:
  gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gcc version and offline tests
        working-directory: tools/hwstation
        run: |
          gcc --version
          cmake -S . -B build-gcc -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Release
          cmake --build build-gcc
          ./build-gcc/hwstation-tests --offline

  clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang version and offline tests
        working-directory: tools/hwstation
        run: |
          clang --version
          cmake -S . -B build-clang -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release
          cmake --build build-clang
          ./build-clang/hwstation-tests --offline

  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: MSVC x64 tests and panel
        working-directory: tools/hwstation
        run: |
          cmake -S . -B build-msvc-x64 -G "Visual Studio 17 2022" -A x64
          cmake --build build-msvc-x64 --config Release
          .\build-msvc-x64\Release\hwstation-tests.exe --offline
      - name: MSVC x86 bridge
        working-directory: tools/hwstation
        run: |
          cmake -S . -B build-msvc-x86 -G "Visual Studio 17 2022" -A Win32
          cmake --build build-msvc-x86 --config Release
