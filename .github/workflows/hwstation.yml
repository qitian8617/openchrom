name: hwstation

on:
  pull_request:
    paths:
      - "tools/hwstation/**"
      - ".github/workflows/hwstation.yml"

permissions:
  contents: read

jobs:
  gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gcc version and offline tests
        working-directory: tools/hwstation
        run: |
          gcc --version
          cmake -S . -B build-gcc -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Release
          cmake --build build-gcc
          ./build-gcc/hwstation-tests --offline

  clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang version and offline tests
        working-directory: tools/hwstation
        run: |
          clang --version
          cmake -S . -B build-clang -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release
          cmake --build build-clang
          ./build-clang/hwstation-tests --offline

  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: MSVC x64 panel and x86 bridge
        shell: pwsh
        working-directory: tools/hwstation
        run: |
          ./scripts/build-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./dist-msvc/hwstation-tests.exe --offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
