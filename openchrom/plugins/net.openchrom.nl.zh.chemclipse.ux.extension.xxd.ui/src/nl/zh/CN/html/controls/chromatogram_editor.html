<h2>控件</h2>

<h3>色谱编辑器</h3>
<table border="1" cellpadding="10" cellspacing="0" summary="色谱编辑器快捷键">
  <tr>
    <td><kbd>&larr;</kbd> 和 <kbd>&rarr;</kbd></td>
    <td>放大后（套索框选），使用方向键或滚动条在色谱图中移动。</td>
  </tr>
  <tr>
    <td>鼠标滚轮</td>
    <td>调整强度轴，实现纵向缩放。</td>
  </tr>
  <tr>
    <td><kbd>Ctrl</kbd> + <kbd>&larr;</kbd> 或 <kbd>&rarr;</kbd></td>
    <td>选择上一个/下一个扫描。</td>
  </tr>
  <tr>
    <td><kbd>Ctrl</kbd> + <kbd>Alt</kbd> + 鼠标左键</td>
    <td>选择峰。</td>
  </tr>
  <tr>
    <td><kbd>Shift</kbd>/<kbd>Alt</kbd> + 鼠标左键</td>
    <td>从左上角开始框选放大。</td>
  </tr>
  <tr>
    <td><kbd>Shift</kbd> + 鼠标左键双击</td>
    <td>重置缩放（1:1）。</td>
  </tr>
</table>
