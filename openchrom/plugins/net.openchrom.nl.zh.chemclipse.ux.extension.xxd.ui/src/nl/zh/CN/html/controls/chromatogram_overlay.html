<h2>控件</h2>

<h3>色谱叠加</h3>
<table border="1" cellpadding="10" cellspacing="0" summary="色谱叠加快捷键">
  <tr>
    <td><kbd>Shift</kbd> + 鼠标左键</td>
    <td>从左上角拖动矩形以放大显示。</td>
  </tr>
  <tr>
    <td><kbd>Ctrl</kbd> + 鼠标左键</td>
    <td>拖动直线测量距离，结果显示在标尺工具栏中。</td>
  </tr>
  <tr>
    <td><kbd>Ctrl</kbd> + 鼠标左键双击</td>
    <td>选择色谱图（以粗线高亮显示）。</td>
  </tr>
  <tr>
    <td><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + 鼠标左键拖动</td>
    <td>自由移动色谱图。</td>
  </tr>
  <tr>
    <td><kbd>Ctrl</kbd> + <kbd>Alt</kbd> + 鼠标左键</td>
    <td>隐藏该色谱图。</td>
  </tr>
</table>
