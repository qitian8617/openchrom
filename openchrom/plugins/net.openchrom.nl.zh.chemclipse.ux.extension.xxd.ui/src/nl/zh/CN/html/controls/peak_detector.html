<h2>控件</h2>

<h3>峰检测器</h3>
<p>使用下方快捷键（或工具栏按钮）设置模式，然后通过添加按钮或其快捷键确认峰。</p>
<table border="1" cellpadding="10" cellspacing="0" summary="峰检测器快捷键">
  <tr>
    <th>按键</th>
    <th>说明</th>
  </tr>
  <tr>
    <td><kbd>D</kbd></td>
    <td><b>B</b>：基线<br/>按住 <kbd>Ctrl</kbd> 并用鼠标拖动。</td>
  </tr>
  <tr>
    <td><kbd>B</kbd></td>
    <td><b>BB</b>：基线到基线<br/>用鼠标左键定义起点和终点。</td>
  </tr>
  <tr>
    <td><kbd>V</kbd></td>
    <td><b>VV</b>：谷到谷<br/>用鼠标左键定义起点和终点。</td>
  </tr>
  <tr>
    <td><kbd>N</kbd></td>
    <td><b>BV</b>：基线到谷<br/>用鼠标左键定义起点和终点。</td>
  </tr>
  <tr>
    <td><kbd>C</kbd></td>
    <td><b>VB</b>：谷到基线<br/>用鼠标左键定义起点和终点。</td>
  </tr>
  <tr>
    <td><kbd>A</kbd></td>
    <td><b>+</b>：添加峰。</td>
  </tr>
</table>
