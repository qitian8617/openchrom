<h2>控件</h2>

<h3>目标物</h3>
<table border="1" cellpadding="10" cellspacing="0" summary="目标物快捷键">
  <tr>
    <td><kbd>Del</kbd></td>
    <td>删除所选谱库鉴定结果。</td>
  </tr>
  <tr>
    <td><kbd>Ctrl</kbd> + <kbd>i</kbd></td>
    <td>手动确认鉴定结果。</td>
  </tr>
  <tr>
    <td><kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>i</kbd></td>
    <td>取消手动确认。</td>
  </tr>
  <tr>
    <td><kbd>Ctrl</kbd> + <kbd>d</kbd></td>
    <td>删除所有谱库鉴定结果。</td>
  </tr>
  <tr>
    <td><kbd>Ctrl</kbd> + <kbd>u</kbd></td>
    <td>添加未知目标物。</td>
  </tr>
  <tr>
    <td><kbd>Ctrl</kbd> + <kbd>q</kbd></td>
    <td>运行所选谱库检索。</td>
  </tr>
</table>
