<h2>控件</h2>

<h3>峰/扫描列表</h3>
<table border="1" cellpadding="10" cellspacing="0" summary="峰/扫描列表快捷键">
  <tr>
    <td><kbd>Del</kbd></td>
    <td>删除所选峰。</td>
  </tr>
  <tr>
    <td><kbd>Ctrl</kbd> + <kbd>i</kbd></td>
    <td>将该条目设为参与分析。</td>
  </tr>
  <tr>
    <td><kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>i</kbd></td>
    <td>将该条目标为不参与分析。</td>
  </tr>
  <tr>
    <td><kbd>Ctrl</kbd> + <kbd>s</kbd></td>
    <td>将所选峰设为内标。</td>
  </tr>
  <tr>
    <td><kbd>Ctrl</kbd> + <kbd>g</kbd></td>
    <td>打开分类器对话框。</td>
  </tr>
  <tr>
    <td><kbd>Ctrl</kbd> + <kbd>d</kbd></td>
    <td>删除所有谱库鉴定结果。</td>
  </tr>
  <tr>
    <td><kbd>Ctrl</kbd> + <kbd>u</kbd></td>
    <td>添加未知目标物。</td>
  </tr>
  <tr>
    <td><kbd>Ctrl</kbd> + <kbd>q</kbd></td>
    <td>运行所选谱库检索。</td>
  </tr>
</table>
