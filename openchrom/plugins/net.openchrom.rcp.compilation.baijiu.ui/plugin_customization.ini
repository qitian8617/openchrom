org.eclipse.ui/SHOW_PROGRESS_ON_STARTUP = true
org.eclipse.ui/SHOW_TRADITIONAL_STYLE_TABS = false
org.eclipse.ui/SHOW_MEMORY_MONITOR = true
org.eclipse.ui/defaultPerspectiveId = net.openchrom.rcp.compilation.baijiu.ui.perspective.plantHome

# Light plant shell. Without this key Eclipse inherits a dark OS/IDE theme
# (e4_dark). Product Synchronize drops preferenceCustomization, so this file
# may never be read; BaijiuPlantTheme forces the same id again at startup.
org.eclipse.e4.ui.css.swt.theme/themeid=org.eclipse.e4.ui.css.theme.e4_default

# Plant chromatogram (CSD) readability. ChemClipse xxd.ui defaults peak labels
# to Verdana-regular-8 and axis tick/title color to theme LineColor (washes out
# on factory screens; Verdana has no CJK). Keys are Eclipse Colors and Fonts
# ids under Charts. Further tweak: Preferences → General → Appearance →
# Colors and Fonts → Charts. BaijiuChromatogramReadability reapplies these at
# shell start so an existing ~/BaijiuFID workspace is not stuck on 8 pt.
org.eclipse.ui.workbench/org.eclipse.chemclipse.ux.extension.xxd.ui.internal.charts.TargetReferenceLabelMarker.Peak.Font=Microsoft YaHei-bold-13
org.eclipse.ui.workbench/org.eclipse.chemclipse.ux.extension.xxd.ui.internal.charts.TargetReferenceLabelMarker.Scan.Font=Microsoft YaHei-bold-13
