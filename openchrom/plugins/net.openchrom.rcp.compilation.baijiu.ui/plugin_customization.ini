org.eclipse.ui.workbench/org.eclipse.chemclipse.ux.extension.xxd.ui.charts.ChromatogramChart.AxisSeconds.Font=Microsoft YaHei-bold-13
org.eclipse.ui.workbench/org.eclipse.chemclipse.ux.extension.xxd.ui.charts.ChromatogramChart.AxisMinutes.Font=Microsoft YaHei-bold-13
org.eclipse.ui.workbench/org.eclipse.chemclipse.ux.extension.xxd.ui.swt.editors.ExtendedChromatogramUI.ScanAxis.Font=Microsoft YaHei-bold-13
