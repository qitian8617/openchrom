<h2>控件</h2>

<h3>S图</h3>
<table border="1" cellpadding="10" cellspacing="0" summary="S图快捷键">
	<tr>
		<td>鼠标左键按下</td>
		<td>开始框选放大</td>
	</tr>
	<tr>
		<td>鼠标左键放开</td>
		<td>结束框选放大</td>
	</tr>
	<tr>
		<td><kbd>Ctrl</kbd>(Win/Linux)/<kbd>CMD</kbd>(Mac) + 鼠标左键按下</td>
		<td>开始选择特征，在特征列表中高亮显示</td>
	</tr>
	<tr>
		<td><kbd>Ctrl</kbd>(Win/Linux)/<kbd>CMD</kbd>(Mac) + 鼠标左键放开</td>
		<td>结束选择特征</td>
	</tr>
	<tr>
		<td>双击</td>
		<td>选择最近的特征</td>
	</tr>
	<tr>
		<td><kbd>Ctrl</kbd>(Win/Linux)/<kbd>CMD</kbd>(Mac) + 双击</td>
		<td>将最近的特征添加到当前选择，或从当前选择中移除</td>
	</tr>
</table>
