<div id="content" role="main">
	<h1>使用帮助系统</h1>

	<p>
	在左侧的<b>内容</b>框架<span class="icon">(<img
	class="icon" src="contents_view.svg" alt="内容图标">)</span>中浏览主题。单击主题即可显示。使用<b>后退</b>和
	<b>前进</b>按钮可在已查看主题的历史记录中导航。
	</p>

	<h2>搜索</h2>

	<p>
	要在文档中快速定位某一主题，请在<b>搜索</b>字段中输入查询。使用<b>搜索</b>框架<span
	class="icon">(<img class="icon" src="search_results_view.svg" alt="搜索图标">)</span>
	可显示搜索视图。您可以通过仅选择感兴趣的章节来缩小<b>范围</b>。
	</p>

	<h2>同步</h2>

	<p>
	单击
	<b>在目录中显示</b>按钮<span class="icon">(<img class="icon"
	src="e_synch_toc_nav.svg" alt="在目录中显示图标">)</span>可在导航树中选中该主题。
	<b>与内容链接</b>按钮<span class="icon">(<img class="icon"
	src="e_auto_synch_toc.svg" alt="与内容链接图标">)</span>可保持导航树与当前主题同步。
	</p>

	<h2>功能部件</h2>

	<p>
	要显示应用程序中已禁用功能的相关文档，请选择<b>显示所有主题</b>按钮<span class="icon">(<img class="icon"
	src="e_show_all.svg" alt="显示所有主题图标">)
	</span>。这会影响目录和搜索结果。
	</p>

	<h2>关键字索引</h2>
	<p>
	要显示按字母顺序排列的关键字索引，请选择<b>索引框架</b>
	<span class="icon">(<img class="icon" src="e_index_view.svg" alt="索引图标">)</span>。
	并非所有产品都包含索引。
	</p>

</div>
